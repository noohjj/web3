<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .bg{
            height: 400px;
            background-color: lightgray;
        }

        .title_wrap{
            padding: 10px;
        }

        .con{
            width: 450px;
            margin: 0 auto;
            border:  1px solid #dbdbdb;
        }

        .title{
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 20px;
        }

        .dark_btn{
            font-size: 30px;
            cursor: pointer;
        }

        body.dark_active{
            background-color: #1d1d1d;
        }

        body.dark_active .con{
            border-color: #333;
        }

        body.dark_active .title{
            color: white;
        }

        .fa-lightbulb{
            color: white;
        }

    </style>
</head>
<body>
    
    <div class="con">
        <div class="bg"></div>
        
        <div class="title_wrap">
            <div class="title">Contents Title</div>
            <div class="dark_btn">
                <i class="fa-solid fa-moon"></i>
            </div>
        </div>
    </div>

    <script>

        const darkBtnEl = document.querySelector('.dark_btn');
        const getDark = localStorage.getItem("DARK_MODE");

        if(getDark === "on"){
            document.body.classList.add("dark_active");
            darkBtnEl.innerHTML = `<i class="fa-solid fa-lightbulb"></i>`;
        }

        const handleDark = () => {
            const getDark = localStorage.getItem("DARK_MODE");
            
            if(getDark === null){
                localStorage.setItem("DARK_MODE", "on");
                document.body.classList.add("dark_active");
                darkBtnEl.innerHTML = `<i class="fa-solid fa-lightbulb"></i>`;
            }else if(getDark === "on"){
                localStorage.removeItem("DARK_MODE");
                document.body.classList.remove("dark_active");
                darkBtnEl.innerHTML = `<i class="fa-solid fa-moon"></i>`;
            }
        }

        darkBtnEl.addEventListener('click', handleDark);

    </script>

</body>
</html>
