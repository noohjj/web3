<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        form{
            max-width: 450px;
            height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
            border: 0.5px solid rgba(0, 0, 0, 0.2);
            border-radius: 20px;
        }

        h3{
            font-size: 50px;
            margin-top: 50px;
            margin-bottom: 20px;
        }

        input{
            width: 400px;
            height: 40px;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 40px;
            border: 0.5px solid rgba(0, 0, 0, 0.2);
        }

        button{
            width: 400px;
            height: 40px;
            margin-bottom: 50px;
            background-color: rgb(28, 94, 194);
            border-radius: 40px;
            color: white;
            font-size: 20px;
            border: 0.5px solid rgba(0, 0, 0, 0.2);
            cursor: pointer;
        }
    </style>
</head>
<body>
    
    <form>

        <h3>LOGIN</h3>
        <input class="id" type="text" placeholder="ID">
        <input class="password" type="text" placeholder="password">
        <h2></h2>
        <button>로그인</button>

    </form>

    <script>
        const formEl = document.querySelector('form');
        const idEl = document.querySelector('.id');
        const passwordEl = document.querySelector('.password');
        const buttonEl = document.querySelector('button');
        const hEl = document.querySelector('h2');

        const userInfo = {
            id:0,
            username: "test",
            password: "123"
        }

        const clickHandler = (e) => {
            e.preventDefault();
            const idValue = idEl.value;
            const passwordValue = passwordEl.value;

            if(idValue !== userInfo.id){
                hEl.innerText("아이디 틀림!")
            }else if(passwordValue !== userInfo.password){
                hEl.innerText("비밀번호 틀림!");
            }else{
                document.write("test님 반갑습니다");
            }
        }

        formEl.addEventListener('submit', clickHandler);

    </script>
</body>
</html>
