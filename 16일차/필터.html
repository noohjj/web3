<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <form>
        <input type="text" placeholder="검색어를 입력해주세요">
    </form>

    <h2 class="title"></h2>
    <p class="desc"></p>
    
    <script>

        // *filter()
        // => 배열의 내용을 가져와서 원하는 값을 필터하여 반환함
        // => 배열이기 때문에 배열로 반환함

        const movies = [
            {
                id: 0,
                title:"조커2",
                desc: "조커 영화"
            },
            {
                id: 1,
                title:"보보보",
                desc: "보보보 입니다"
            },
            {
                id: 2,
                title:"따따베",
                desc: "빵빵하게"
            },
        ];

        const formEl = document.querySelector('form');
        const inputEl = document.querySelector('input');
        const titleEl = document.querySelector('.title');
        const descEl = document.querySelector('.desc');

        
        const handleSubmit = (e) => {
            e.preventDefault();
            const inputValue = inputEl.value;
            const result = movies.filter((a) => a.title === inputValue);
            console.log(result);

            if(result.length !== 0){
                titleEl.innerText = `제목: ${result[0].title}`;
                descEl.innerText = `내용: ${result[0].desc};`;
            }else{
                titleEl.innerText = `${inputValue}에 대한 검색결과가 없습니다`;
                descEl.innerText = `" "`;
            }
        }

        formEl.addEventListener('submit', handleSubmit);
        
    </script>

</body>
</html>
